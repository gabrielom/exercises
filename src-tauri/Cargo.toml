[package]
name = "exercises"
version = "0.1.0"
description = "Exercise tracker — reps, timers, and the Corpo stretching routine"
authors = ["gabrielom"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri builds the app through a library crate so the same code can be reused
# by a mobile target later; main.rs is a thin shim over it.
name = "exercises_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only to move the window controls into the content column — see src/mac.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
